# Synatomo — instance de DÉVELOPPEMENT, séparée de la production (/var/www/matomo).
# Publiée sur 127.0.0.1:8291 seulement. Base jetable : `bin/dev reset` la recrée.
# Secrets : dev/.env (mode 600, non versionné).
name: synatomo-dev
services:
  db:
    image: mariadb:11.8.9
    container_name: synatomo_dev_db
    restart: "no"
    environment:
      MARIADB_DATABASE: matomo
      MARIADB_USER: matomo
      MARIADB_PASSWORD: ${SYN_DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${SYN_DB_ROOT_PASSWORD}
    command: ["--innodb-buffer-pool-size=64M", "--max-connections=30", "--performance-schema=OFF", "--max-allowed-packet=64M"]
    volumes:
      - db:/var/lib/mysql
    networks: [internal]
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: { driver: json-file, options: { max-size: "5m", max-file: "2" } }
  app:
    image: matomo:5.14.0-apache
    container_name: synatomo_dev_app
    restart: "no"
    depends_on:
      db: { condition: service_healthy }
    environment:
      SYN_DB_PASSWORD: ${SYN_DB_PASSWORD}
      SYN_ADMIN_PASSWORD: ${SYN_ADMIN_PASSWORD}
      PHP_MEMORY_LIMIT: 256M
    volumes:
      - app:/var/www/html
      - ../plugins:/opt/synatomo/plugins:ro
      - ./:/opt/synatomo/dev:ro
    ports:
      - "127.0.0.1:8291:80"
    networks: [internal, egress]
    mem_limit: 384m
    logging: { driver: json-file, options: { max-size: "5m", max-file: "2" } }
volumes:
  db:
  app:
networks:
  internal:
    internal: true
  egress: {}
